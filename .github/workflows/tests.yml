name: Tests
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev,ui,vision,datasheet]"
      - run: python -m pytest -q -m "not integration and not stress and not crash_injection"
  ngspice-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update
      - run: sudo apt-get install -y ngspice
      - run: python -m pip install -e ".[dev,ui,vision,vision-ai,vision-ocr,datasheet]"
      - run: python -m pytest -q -m integration
  bounded-stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,ui,vision,datasheet]"
      - run: python -m pytest -q -m stress
  native-ocr-inference:
    runs-on: ubuntu-latest
    env:
      CIRCUITCARE_REQUIRE_NATIVE_INFERENCE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,vision,vision-ocr]"
      - run: python -m pytest -q -m integration tests/test_native_integration.py -k ocr
  isolated-crash-injection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q -m crash_injection -rs
